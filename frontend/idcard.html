<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="idCard" class="id-card">

    <h2>GOVT ARTS AND SCIENCE COLLEGE</h2>

    <img id="studentPhoto" width="120" height="120">

    <p><b>Name :</b> <span id="name"></span></p>

    <p><b>Reg No :</b> <span id="regno"></span></p>

    <p><b>Department :</b> <span id="department"></span></p>

    <p><b>Year :</b> <span id="year"></span></p>

    <p><b>Blood Group :</b> <span id="blood"></span></p>

    <p><b>Phone :</b> <span id="phone"></span></p>

    <button onclick="window.print()">
        Print ID Card
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
