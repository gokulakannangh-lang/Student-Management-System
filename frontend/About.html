
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About College</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            transition: 0.3s;
        }

        .about-container {
            max-width: 700px;
            margin: 20px auto;
        }

        .about-card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        input[readonly], textarea[readonly] {
            background: #f8fafc;
            color: #334155;
        }

        button, .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 17px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        #logoPreview {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin: 15px auto;
        }

        .college-logo {
            text-align: center;
        }

        .status {
            margin-top: 12px;
        }

        body.dark-mode {
            background: #0f172a;
            color: #f8fafc;
        }

        body.dark-mode .about-card {
            background: #1e293b;
        }

        body.dark-mode input,
        body.dark-mode textarea {
            background: #334155;
            color: white;
        }

        body.dark-mode input[readonly],
        body.dark-mode textarea[readonly] {
            background: #334155;
            color: #f8fafc;
        }
    </style>
</head>

<body>

<div class="about-container">

    <h1>About College</h1>

    <a href="index.html" class="back-btn">
        ← Back to Dashboard
    </a>

    <!-- College Details -->
    <section class="about-card">

        <h2>🏫 College Details</h2>

        <label for="college_name">College Name</label>
        <input id="college_name" type="text" readonly>

        <label for="college_address">Address</label>
        <textarea id="college_address" rows="3" readonly></textarea>

        <label for="college_phone">Phone</label>
        <input id="college_phone" type="text" readonly>

        <label for="college_email">Website</label>
        <input id="college_email" type="text" readonly>

        <label for="principal_name">Principal Name</label>
        <input id="principal_name" type="text" readonly>

        <p id="detailsMessage" class="status" role="status">
            Loading college details...
        </p>

    </section>

    <!-- College Logo -->
    <section class="about-card">

        <h2>🖼️ College Logo</h2>

        <div class="college-logo">
            <img
                id="logoPreview"
                src="https://res.cloudinary.com/dbarxd2bg/image/upload/v1792638247/logo_pd2qll.png"
                alt="College Logo"
            >
        </div>

    </section>

    <!-- Appearance -->
    <section class="about-card">

        <h2>🎨 Appearance</h2>

        <p>Change your dashboard theme.</p>

        <button type="button" id="themeToggle">
            Enable Dark Mode
        </button>

    </section>

</div>

<script>
    const $ = id => document.getElementById(id);

    // Load college details from backend
    async function loadAbout() {

        const message = $("detailsMessage");

        message.textContent = "Loading college details...";

        try {
            const response = await fetch(
                "https://student-management-system-5xwr.onrender.com/about"
            );

            if (!response.ok) {
                throw new Error("HTTP error: " + response.status);
            }

            const details = await response.json();

            $("college_name").value =
                details.college_name ?? "";

            $("college_address").value =
                details.college_address ?? "";

            $("college_phone").value =
                details.college_phone ?? "";

            $("college_email").value =
                details.college_email ?? "";

            $("principal_name").value =
                details.principal_name ?? "";

            message.textContent =
                "College details loaded successfully.";

        } catch (error) {
            console.error("About page error:", error);

            message.textContent =
                "Failed to load college details. Check your internet or backend connection.";
        }
    }

    // Light / Dark Mode
    function applyTheme(theme) {

        document.body.classList.toggle(
            "dark-mode",
            theme === "dark"
        );

        $("themeToggle").textContent =
            theme === "dark"
                ? "Enable Light Mode"
                : "Enable Dark Mode";
    }

    applyTheme(localStorage.getItem("smsTheme") || "light");

    $("themeToggle").addEventListener("click", function () {

        const theme =
            document.body.classList.contains("dark-mode")
                ? "light"
                : "dark";

        localStorage.setItem("smsTheme", theme);

        applyTheme(theme);
    });

    // Start loading
    loadAbout();
</script>

</body>
</html>
