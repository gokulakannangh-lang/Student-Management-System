<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
    <script>

if(localStorage.getItem("login") !== "true"){
    window.location.href="login.html";
}

</script>

</head>
<body>

<h1 align="center">Student Records</h1>

<div class="search-box">
    <input type="search" id="search" placeholder="Search Student">
    <button onclick="searchStudent()">Search

    </button>
      
      <select id="departmentFilter" onchange="filterStudentsByDepartment()">
        <option value="">All Departments</option>
        <option value="B.Sc Computer Science">B.Sc Computer Science</option>
        <option value="BCA">BCA</option>
        <option value="B.Sc Information Technology">B.Sc Information Technology</option>
        <option value="B.Sc Data Science">B.Sc Data Science</option>
        <option value="B.Sc Mathematics">B.Sc Mathematics</option>
        <option value="B.Sc Physics">B.Sc Physics</option>
        <option value="B.Sc Chemistry">B.Sc Chemistry</option>
        <option value="B.Sc Biotechnology">B.Sc Biotechnology</option>
        <option value="B.Sc Microbiology">B.Sc Microbiology</option>
        <option value="B.Sc Electronics">B.Sc Electronics</option>
        <option value="B.Sc Botany">B.Sc Botany</option>
        <option value="B.Sc Zoology">B.Sc Zoology</option>
        <option value="B.Com">B.Com</option>
        <option value="B.Com Computer Applications">B.Com Computer Applications</option>
        <option value="BBA">BBA</option>
        <option value="B.A English">B.A English</option>
        <option value="B.A Tamil">B.A Tamil</option>
        <option value="B.A History">B.A History</option>
        <option value="B.A Economics">B.A Economics</option>
        <option value="B.A Political Science">B.A Political Science</option>
</select>

   <button type="button" id="deleteSelectedBtn" onclick="deleteSelectedStudent()">
    🗑️ Delete Selected
</button>

    <button onclick="window.location.href='dashboard.html'">
        Back
    </button>

    <button onclick="logout()">
        Logout
    </button>

    
</div>

<hr>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Register No</th>
            <th>Gender</th>
            <th>Date of Birth</th>
            <th>Blood Group</th>
            <th>Department</th>
            <th>Year</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Parent Name</th>
            <th>Parent Phone</th>
            <th>Batch</th>
            <th>College Shift</th>
            <th>Admission Date</th>
            <th>Profile</th>
            <th>Photo</th>
   </tr>
            
    </thead>

    <tbody id="studentTable">
    </tbody>
</table>

<!-- Photo Popup -->
<div id="photoModal" class="modal" onclick="closePhoto()">

    <span class="close">&times;</span>

    <img id="popupPhoto" class="modal-content" onclick="event.stopPropagation()">
</div>

<input
    type="file"
    id="photo"
    accept="image/*"
    style="display:none;">

<script src="script.js"></script>

</body>
</html>
