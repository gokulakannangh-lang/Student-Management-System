<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1 align="center">
    Student Profile
</h1>

<div class="buttons">

    <button onclick="window.location.href='profile.html'">
        ← Back
    </button>

    <button onclick="openSelectedIDCard()">
        🪪 ID Card
    </button>

</div>

<hr>


<div class="profile-card">

    <center>

        <img
            id="profilePhoto"
            width="150"
            height="150"
            style="object-fit:cover;border-radius:10px;"
        >

    </center>


    <table border="1" width="100%">

        <tr>
            <td><b>Name</b></td>
            <td id="profileName"></td>
        </tr>

        <tr>
            <td><b>Register No</b></td>
            <td id="profileRegno"></td>
        </tr>

        <tr>
            <td><b>Gender</b></td>
            <td id="profileGender"></td>
        </tr>

        <tr>
            <td><b>Date of Birth</b></td>
            <td id="profileDob"></td>
        </tr>

        <tr>
            <td><b>Blood Group</b></td>
            <td id="profileBlood"></td>
        </tr>

        <tr>
            <td><b>Department</b></td>
            <td id="profileDepartment"></td>
        </tr>

        <tr>
            <td><b>Year</b></td>
            <td id="profileYear"></td>
        </tr>

        <tr>
            <td><b>Phone</b></td>
            <td id="profilePhone"></td>
        </tr>

        <tr>
            <td><b>Email</b></td>
            <td id="profileEmail"></td>
        </tr>

        <tr>
            <td><b>Address</b></td>
            <td id="profileAddress"></td>
        </tr>

        <tr>
            <td><b>Parent Name</b></td>
            <td id="profileParentName"></td>
        </tr>

        <tr>
            <td><b>Parent Phone</b></td>
            <td id="profileParentPhone"></td>
        </tr>

        <tr>
            <td><b>Batch</b></td>
            <td id="profileBatch"></td>
        </tr>

        <tr>
            <td><b>Admission Date</b></td>
            <td id="profileAdmissionDate"></td>
        </tr>

    </table>

</div>


<script src="script.js"></script>

</body>

</html>
